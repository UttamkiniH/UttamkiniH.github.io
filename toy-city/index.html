<style>
/* Layout: full-bleed WebGL toy city with a floating HUD; details slide in from the right (desktop) or up from the bottom (phone); recruiter mode swaps the city for a one-column resume built from the same data. */
:root {
  --sky: #e2f0f7;
  --surface: #ffffff;
  --surface-2: #eef4f8;
  --ink: #16202f;
  --muted: #56667c;
  --line: rgba(22, 32, 47, 0.12);
  --accent: #ff6a3d;
  --accent-ink: #16202f;
  --accent-text: #c2410c;
  --focus: #c4461b;
  --label-bg: rgba(255, 255, 255, 0.94);
  --label-ink: #16202f;
  --shadow: 0 12px 32px rgba(22, 40, 70, 0.16);
  --font-display: "Fredoka", ui-rounded, "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #0b1424; --surface: #131e31; --surface-2: #1b283e; --ink: #e9eff8; --muted: #9aabc1;
    --line: rgba(233, 239, 248, 0.12); --accent: #ff8659; --accent-ink: #1c0c04; --accent-text: #ff8659; --focus: #ff8659;
    --label-bg: rgba(19, 30, 49, 0.92); --label-ink: #e9eff8; --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #0b1424; --surface: #131e31; --surface-2: #1b283e; --ink: #e9eff8; --muted: #9aabc1;
  --line: rgba(233, 239, 248, 0.12); --accent: #ff8659; --accent-ink: #1c0c04; --accent-text: #ff8659; --focus: #ff8659;
  --label-bg: rgba(19, 30, 49, 0.92); --label-ink: #e9eff8; --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
body:not(.mode-resume) { overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: 0.88em; }

/* ---------- city shell ---------- */
#city { position: fixed; inset: 0; }
body.mode-resume #city { display: none; }
#scene { position: absolute; inset: 0; z-index: 0; touch-action: none; } /* own stacking context: label z-indexes stay under the HUD and panel */
#scene canvas { display: block; outline: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.label {
  pointer-events: auto; cursor: pointer; white-space: nowrap; border: 0;
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 13px/1 var(--font-display); letter-spacing: 0.01em;
  color: var(--label-ink); background: var(--label-bg);
  padding: 7px 12px 7px 9px; border-radius: 999px; box-shadow: 0 4px 14px rgba(10, 20, 40, 0.18);
  transition: transform 0.2s, background 0.2s, color 0.2s;
}
.label::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--accent)); }
.label.sm { font: 600 11px/1 var(--font-body); padding: 5px 9px; }
.label.sm::before { display: none; }
.label:hover, .label.is-hot { background: var(--accent); color: var(--accent-ink); transform: translateY(-3px); }
.label:hover::before, .label.is-hot::before { background: currentColor; }

.hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud > * { pointer-events: auto; }
.hud-left { display: grid; gap: 6px; justify-items: start; min-width: 0; }
.brand { background: var(--surface); border-radius: 14px; padding: 9px 14px; box-shadow: var(--shadow); line-height: 1.15; }
.brand b { display: block; font: 700 19px/1.1 var(--font-display); }
.brand span { font-size: 12px; color: var(--muted); font-weight: 600; }
.activity {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px;
  background: var(--surface); box-shadow: var(--shadow); font: 500 11px/1 var(--font-mono); color: var(--muted); white-space: nowrap;
}
.activity b { color: var(--ink); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #35c26b; box-shadow: 0 0 0 0 rgba(53, 194, 107, 0.5); animation: pulse 2s infinite; flex: none; }
.dot.sample { background: var(--muted); animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(53, 194, 107, 0); } 100% { box-shadow: 0 0 0 0 rgba(53, 194, 107, 0); } }
.hud-right { display: flex; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
  padding: 9px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font: 600 14px/1 var(--font-body); text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.hud .btn { box-shadow: var(--shadow); border-color: transparent; }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
}
.hud .icon-btn { box-shadow: var(--shadow); border-color: transparent; }
.icon-btn svg { width: 19px; height: 19px; }
.short { display: none; }

.chips {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 8px; justify-content: center;
  overflow-x: auto; scrollbar-width: none; transition: opacity 0.25s;
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding-top: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 10px 15px; border-radius: 999px; border: 0; background: var(--surface); color: var(--ink);
  font: 600 14px/1 var(--font-display); box-shadow: var(--shadow);
}
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
.chip[aria-current="true"] { background: var(--ink); color: var(--sky); }

.mapctl { position: absolute; z-index: 3; display: grid; gap: 6px; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 64px); }
.mapctl .icon-btn { box-shadow: var(--shadow); border-color: transparent; width: 44px; height: 44px; }
/* keep the district chips clear of the open detail panel */
@media (min-width: 721px) { body.panel-open .chips { right: calc(min(400px, 42vw) + 32px); justify-content: flex-start; flex-wrap: wrap; } }
@media (pointer: coarse) { .chip { min-height: 44px; } }
.mapctl .walk-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
body.walking .mapctl [data-map] { display: none; }

/* walk mode: street-level camera */
.stick {
  position: absolute; z-index: 3; display: none; width: 124px; height: 124px; border-radius: 50%; touch-action: none;
  right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 70px);
  background: color-mix(in srgb, var(--surface) 55%, transparent); border: 2px solid var(--line); box-shadow: var(--shadow);
}
.stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); pointer-events: none; }
body.walking.touch .stick { display: block; }
.walk-open {
  position: absolute; z-index: 3; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px;
  bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 64px); max-width: calc(100% - 32px);
  padding: 12px 18px; border-radius: 999px; border: 0; cursor: pointer; box-shadow: var(--shadow);
  background: var(--accent); color: var(--accent-ink); font: 600 15px/1.2 var(--font-display);
}
.walk-open b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.walk-open kbd { font: 600 12px/1 var(--font-mono); padding: 4px 7px; border-radius: 6px; background: var(--accent-ink); color: var(--accent); }
body.walking .walk-open.show { display: inline-flex; }
body.walking.touch .walk-open { left: max(16px, env(safe-area-inset-left, 0px)); transform: none; max-width: calc(100% - 180px); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 118px); font-size: 14px; }
body.walking.touch .walk-open kbd { display: none; }
body.walking.touch .hint { top: calc(max(12px, env(safe-area-inset-top, 0px)) + 72px); bottom: auto; }
body.panel-open .walk-open, body.panel-open .stick { display: none !important; }
.fade { position: absolute; inset: 0; z-index: 4; background: var(--sky); opacity: 0; pointer-events: none; transition: opacity 0.18s; }
.fade.on { opacity: 1; }
.career { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 12px; border-left: 2px solid var(--line); }
.career li { padding-left: 14px; position: relative; }
.career li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.career li:not(:first-child)::before { background: var(--surface-2); border: 2px solid var(--line); }
.career b { display: block; font: 600 16px/1.3 var(--font-display); }
.career small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.hint {
  position: absolute; left: 50%; z-index: 3; transform: translateX(-50%); margin: 0;
  top: calc(max(12px, env(safe-area-inset-top, 0px)) + 104px);
  padding: 9px 14px; border-radius: 999px; background: var(--ink); color: var(--sky);
  font: 600 13px/1.2 var(--font-body); white-space: nowrap; box-shadow: var(--shadow);
  transition: opacity 0.5s;
}
.hint.gone { opacity: 0; pointer-events: none; }

/* ---------- detail panel ---------- */
#panel {
  position: absolute; z-index: 5; display: flex; flex-direction: column;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  visibility: hidden; transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.38s;
}
#panel.open { visibility: visible; transform: none; transition-delay: 0s; }
.panel-head { display: flex; justify-content: flex-end; align-items: center; padding: 10px 10px 0; position: relative; }
.grabber { display: none; }
#panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 22px 24px; }
@media (min-width: 721px) {
  #panel { top: 72px; right: 16px; bottom: 16px; width: min(400px, 42vw); border-radius: 22px; transform: translateX(calc(100% + 32px)); }
}
@media (max-width: 720px) {
  #panel {
    left: 0; right: 0; bottom: 0; max-height: 60%; border-radius: 22px 22px 0 0; transform: translateY(105%);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #panel-body { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  .grabber { display: block; position: absolute; left: 50%; top: 8px; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--line); }
  body.panel-open .chips { opacity: 0; pointer-events: none; }
  body.panel-open .mapctl { opacity: 0; pointer-events: none; }
  .chips { justify-content: flex-start; }
  .long { display: none; }
  .short { display: inline; }
  .brand b { font-size: 17px; }
  .proj-head .device { --w: 84px; }
  .hint { top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 64px); }
}

.eyebrow { margin: 0 0 6px; font: 500 11px/1.2 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); }
#panel h2, #resume h2 { font: 600 28px/1.1 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
#panel h3, #resume h3.group { margin: 18px 0 8px; font: 500 11px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.lede { margin: 0 0 12px; color: var(--muted); font-weight: 600; }
#panel p { margin: 0 0 12px; }
.facts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin: 16px 0; }
.facts div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.facts dt { font-size: 12px; color: var(--muted); line-height: 1.25; }
.facts dd { margin: 0 0 2px; font: 600 clamp(19px, 5.4vw, 24px)/1.1 var(--font-display); font-variant-numeric: tabular-nums; order: -1; }
.facts div { display: flex; flex-direction: column; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.credit { font-size: 12px; color: var(--muted); margin-top: 20px !important; }
.back { background: none; border: 0; padding: 4px 0; margin-bottom: 8px; color: var(--muted); font: 600 13px var(--font-body); cursor: pointer; }
.back:hover { color: var(--accent); }
.rows { display: grid; gap: 8px; margin-top: 14px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
}
.row:hover { border-color: var(--accent); }
.row > span:nth-child(2) { flex: 1; min-width: 0; }
.row b { display: block; font: 600 16px/1.25 var(--font-display); }
.row small { display: block; color: var(--muted); font-size: 13px; }
.chev { color: var(--muted); font-size: 22px; line-height: 1; }
a.row { color: inherit; text-decoration: none; align-items: flex-start; }
a.row small + small { margin-top: 4px; color: var(--ink); }
.art-ico { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--surface-2); color: var(--muted); font: 600 13px/1 var(--font-mono); }
.art-ico svg { width: 20px; height: 20px; }
.crane-ico { width: 56px; height: 56px; flex: none; border-radius: 12px; background: repeating-linear-gradient(-45deg, var(--accent) 0 7px, var(--surface-2) 7px 14px); }
.ticks { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.ticks li { position: relative; padding-left: 18px; }
.ticks li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font: 500 12px/1 var(--font-mono); padding: 6px 9px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.case-btn { width: 100%; margin: 2px 0 14px; }
.badge { display: inline-block; margin-top: 4px; padding: 3px 8px; border-radius: 999px; border: 1px dashed var(--muted); color: var(--muted); font: 500 11px/1.3 var(--font-mono); }
.proj-head { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 14px; }
.proj-head > div { min-width: 0; }
.note { font-size: 13px; color: var(--muted); background: var(--surface-2); padding: 10px 12px; border-radius: 12px; }
.timeline { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.edu { padding: 12px 0; border-top: 1px solid var(--line); }
.edu b { display: block; font: 600 17px/1.3 var(--font-display); }
.edu span { color: var(--muted); font-size: 14px; }
.edu p { margin: 6px 0 0 !important; }
.copyline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 0; }
.copyline code { padding: 10px 12px; background: var(--surface-2); border-radius: 10px; user-select: all; min-width: 0; overflow-wrap: anywhere; }

/* phone frame used for project previews */
.device {
  --w: 128px; width: var(--w); max-width: 100%; aspect-ratio: 9 / 19; flex: none; padding: calc(var(--w) * 0.045);
  border-radius: calc(var(--w) * 0.2); background: #0e131b; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22), inset 0 0 0 1.5px #2b3442;
}
.device.sm { --w: 54px; }
.screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: calc(var(--w) * 0.16); background: linear-gradient(160deg, var(--c1), var(--c2)); }
.screen video { width: 100%; height: 100%; object-fit: cover; display: block; }
.fake { position: absolute; inset: 0; padding: 18% 9% 0; display: flex; flex-direction: column; gap: 5%; animation: fk 7s ease-in-out infinite alternate; }
.fake i { display: block; flex: none; border-radius: calc(var(--w) * 0.04); background: rgba(255, 255, 255, 0.78); }
.fake .fk-bar { height: 4%; width: 55%; }
.fake .fk-hero { height: 22%; background: rgba(255, 255, 255, 0.4); }
.fake .fk-row { height: 3.5%; }
.fake .fk-row.s { width: 60%; }
.fake .fk-card { height: 13%; background: rgba(255, 255, 255, 0.58); }
@keyframes fk { to { transform: translateY(-34%); } }

/* ---------- loader ---------- */
#loader {
  position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--sky);
  transition: opacity 0.6s, visibility 0s linear 0.6s;
}
#loader.done { opacity: 0; visibility: hidden; }
.loader-inner { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 0 16px; }
.blocks { display: flex; align-items: flex-end; gap: 6px; height: 54px; }
.blocks i { width: 18px; border-radius: 5px; background: var(--accent); animation: rise 1.2s ease-in-out infinite; }
.blocks i:nth-child(1) { height: 24px; }
.blocks i:nth-child(2) { height: 44px; animation-delay: 0.15s; background: var(--ink); }
.blocks i:nth-child(3) { height: 32px; animation-delay: 0.3s; }
@keyframes rise { 50% { transform: translateY(-8px); } }
.loading-text { margin: 0; font: 600 16px var(--font-display); }
.fail { display: none; }
#loader.failed .fail { display: grid; gap: 12px; justify-items: center; }
#loader.failed .blocks, #loader.failed .loading-text, #loader.failed .skip { display: none; }

/* ---------- recruiter mode ---------- */
#resume {
  min-height: 100%; padding-block: 36px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.r-wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 44px; }
.r-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.r-head > div { min-width: 0; }
.r-head h1 { margin: 0 0 6px; font: 700 clamp(40px, 9vw, 68px)/1 var(--font-display); letter-spacing: -0.01em; }
.r-sum { max-width: 58ch; margin: 0 0 12px; }
.r-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.r-facts a { color: var(--accent-text); font-weight: 600; }
.r-proj .ticks { margin: 8px 0 10px; }
.r-live { display: inline-flex; align-items: center; gap: 8px; margin: 0; font: 500 12px/1.3 var(--font-mono); color: var(--muted); }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; }
#resume section > h2 { font-size: 24px; margin-bottom: 14px; }
.r-proj { display: flex; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.r-proj .device { --w: 76px; }
.r-proj > div { min-width: 0; }
.r-proj h3, .r-item h3 { margin: 0; font: 600 19px/1.25 var(--font-display); }
.r-meta { margin: 2px 0 8px; color: var(--muted); font-size: 14px; }
.r-proj p, .r-item p { margin: 0 0 10px; }
.r-proj .actions { margin-top: 12px; }
.r-proj .btn { min-height: 34px; padding: 7px 12px; font-size: 13px; }
.r-item { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.r-when { font: 500 13px/1.5 var(--font-mono); color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.r-skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 4px 20px; }
#resume h3.group { margin-top: 0; }
.r-foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
@media (max-width: 560px) { .r-item { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

#toast {
  position: fixed; left: 50%; z-index: 20; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 8px);
  padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--sky); font-weight: 600;

async function loadActivity(user) {
  if (!user) return SAMPLE_ACTIVITY;
  try {
    const res = await fetch(`https://api.github.com/users/${encodeURIComponent(user)}/events/public?per_page=100`);
    if (!res.ok) throw new Error(String(res.status));
    const since = Date.now() - 30 * 864e5;
    let commits = 0, latestRepo = null;
    for (const e of await res.json()) {
      if (e.type !== "PushEvent" || new Date(e.created_at) < since) continue;
      commits += e.payload?.size ?? e.payload?.commits?.length ?? 1;
      latestRepo ??= e.repo?.name?.split("/")[1] ?? null;
    }
    return { commits, latestRepo, sample: false };
  } catch {
    // Blocked or offline (an artifact cannot reach api.github.com): no numbers rather than made-up ones.
    return { commits: null, latestRepo: null, sample: false, unavailable: true };
  }
}

/* ---------- UI state ---------- */
const panel = $("#panel"), panelBody = $("#panel-body");

function setHash(h) {
  try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch {}
}

function markActive(district) {
  for (const c of document.querySelectorAll(".chip")) c.setAttribute("aria-current", String(c.dataset.go === district));
}

App.select = function select(key) {
  const html = renderPanel(key);
  if (!html) return;
  App.current = key;
  panelBody.innerHTML = html;
  panelBody.scrollTop = 0;
  panel.classList.add("open");
  panel.inert = false;
  panel.setAttribute("aria-hidden", "false");
  document.body.classList.add("panel-open");
  markActive(districtOf(key));
  App.city?.focus(key);
  setHash(key.replace(":", "-"));
  dismissHint();
};

App.close = function close() {
  if (!App.current) return;
  App.current = null;
  panel.classList.remove("open");
  panel.inert = true;
  panel.setAttribute("aria-hidden", "true");
  document.body.classList.remove("panel-open");
  markActive(null);
  App.city?.overview();
  setHash("");
};

function setMode(mode) {
  const resume = mode === "resume";
  document.body.classList.toggle("mode-resume", resume);
  $("#resume").hidden = !resume;
  App.city?.pause(resume);
  store.set("toycity.mode", mode);
  if (resume) {
    window.scrollTo(0, 0);
    setHash("recruiter");
  } else {
    App.city?.resize();
    setHash(App.current ? App.current.replace(":", "-") : "");
  }
}

const ICONS = {
  moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`,
  sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
};
function updateThemeBtn() {
  const dark = App.isDark(), b = $("#theme-btn");
  b.innerHTML = dark ? ICONS.sun : ICONS.moon;
  b.setAttribute("aria-label", dark ? "Switch to day" : "Switch to night");
}
function toggleTheme() {
  const t = App.isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  store.set("toycity.theme", t);
}
function onThemeChange() { updateThemeBtn(); App.city?.setTheme(); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onThemeChange);
new MutationObserver(onThemeChange).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
function copy(text, btn) {
  const fallback = () => {
    const code = btn.closest(".copyline")?.querySelector("code");
    if (code) getSelection().selectAllChildren(code);
    toast(code ? "Address selected. Copy it from there." : text);
  };
  try {
    navigator.clipboard.writeText(text).then(() => toast("Email copied"), fallback);
  } catch { fallback(); }
}

let hintTimer;
function showHint() {
  const h = $("#hint");
  h.textContent = matchMedia("(pointer: coarse)").matches
    ? "Drag to move · pinch to zoom · tap a building"
    : "Drag to move · scroll to zoom · click a building";
  h.classList.remove("gone");
  hintTimer = setTimeout(dismissHint, 6500);
}
function dismissHint() { clearTimeout(hintTimer); $("#hint").classList.add("gone"); }
App.dismissHint = dismissHint;
App.hint = (text, ms = 6500) => {
  clearTimeout(hintTimer);
  $("#hint").textContent = text;
  $("#hint").classList.remove("gone");
  hintTimer = setTimeout(dismissHint, ms);
};
App.toast = toast;

App.cityReady = () => {
  $("#loader").classList.add("done");
  if (App.pendingKey) { App.select(App.pendingKey); App.pendingKey = null; }
  else showHint();
};
App.noWebGL = () => {
  $("#loader").classList.add("failed");
  setMode("resume");
};

document.addEventListener("click", (e) => {
  const m = e.target.closest("[data-map]");
  if (m) {
    const k = m.dataset.map;
    if (k === "home") { if (App.current) App.close(); App.city?.resetView(); }
    else App.city?.zoomBy(k === "in" ? 1.25 : 1 / 1.25);
    return;
  }
  if (e.target.closest("[data-walk]")) { App.city?.toggleWalk(); return; }
  const t = e.target.closest("[data-go],[data-mode],[data-copy],[data-close],[data-theme-toggle]");
  if (!t) return;
  if (t.dataset.go) App.select(t.dataset.go);
  else if (t.dataset.mode) setMode(t.dataset.mode);
  else if (t.dataset.copy) copy(t.dataset.copy, t);
  else if (t.hasAttribute("data-close")) App.close();
  else if (t.hasAttribute("data-theme-toggle")) toggleTheme();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (App.current) App.close();
  else App.city?.exitWalk();
});

/* ---------- boot ---------- */
$("#brand-name").textContent = CONTENT.name;
$("#brand-role").textContent = CONTENT.role;
$("#chips").innerHTML = DISTRICTS.map((d) => `<button class="chip" type="button" data-go="${d.key}" style="--dot:${d.color}" aria-current="false">${d.label}</button>`).join("");
updateThemeBtn();
renderResume();
renderActivity();

const startHash = location.hash.slice(1);
if (startHash === "recruiter" || (!startHash && store.get("toycity.mode") === "resume")) setMode("resume");
else if (startHash) App.pendingKey = startHash.replace("-", ":");
// links like #recruiter or #project-0 also work on a page that is already open
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h === "recruiter") setMode("resume");
  else if (h && App.city) { if (document.body.classList.contains("mode-resume")) setMode("city"); App.select(h.replace("-", ":")); }
});

loadActivity(CONTENT.github).then((a) => {
  App.activity = a;
  renderResume();
  renderActivity();
  App.city?.setActivity(a);
  if (App.current) panelBody.innerHTML = renderPanel(App.current);
});

// If the 3D bundle never arrives (offline CDN, old browser), offer the resume instead of a stuck loader.
setTimeout(() => { if (!App.city) $("#loader").classList.add("failed"); }, 15000);
</script>

<script type="module">
import * as THREE from "three";
import { MapControls } from "three/addons/controls/MapControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { HorizontalTiltShiftShader } from "three/addons/shaders/HorizontalTiltShiftShader.js";
import { VerticalTiltShiftShader } from "three/addons/shaders/VerticalTiltShiftShader.js";

const host = document.getElementById("scene");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
} catch (err) {
  App.noWebGL();
  throw err;
}

const coarse = matchMedia("(pointer: coarse)").matches;
const narrow = () => host.clientWidth < 720;
const UP = new THREE.Vector3(0, 1, 0);
const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const lerp = THREE.MathUtils.lerp;

renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.75 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = "labels";
host.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
const HOME = new THREE.Vector3(28, 26, 28);
camera.position.copy(HOME);

const controls = new MapControls(camera, renderer.domElement);
controls.target.set(-1.5, 0, -1.5);
camera.position.add(controls.target);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, minZoom: 0.6, maxZoom: 3.4, minPolarAngle: 0.72, maxPolarAngle: 1.08 });
controls.update();

// Tilt-shift: blur the top and bottom of the frame so the city reads as a miniature.
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType }));
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const hBlur = new ShaderPass(HorizontalTiltShiftShader);
const vBlur = new ShaderPass(VerticalTiltShiftShader);
hBlur.uniforms.r.value = vBlur.uniforms.r.value = 0.5;
composer.addPass(hBlur);
composer.addPass(vBlur);
composer.addPass(new OutputPass());

/* ---------- lights & theme ---------- */
const hemi = new THREE.HemisphereLight("#ffffff", "#888888", 1);
const sun = new THREE.DirectionalLight("#ffffff", 2);
sun.position.set(14, 24, 8);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(coarse ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 70 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(hemi, sun, sun.target);

const THEMES = {
  day: { sky: "#cfe7f4", water: "#79c4e2", hemiSky: "#eaf6ff", hemiGround: "#c7b28e", hemi: 1.25, sun: "#fff1dc", sunI: 2.5, cloud: "#ffffff", lit: "#eaf6ff", unlit: "#a6c6db", lamp: "#d7dce3", smoke: "#f4f4f4", beam: false },
  night: { sky: "#0d1830", water: "#173252", hemiSky: "#4d6cab", hemiGround: "#1b1f2e", hemi: 0.5, sun: "#a9bfff", sunI: 0.8, cloud: "#56637f", lit: "#ffd57e", unlit: "#1d293f", lamp: "#ffd57e", smoke: "#8d97ab", beam: true },
};
let THEME = THEMES.day;

/* ---------- helpers ---------- */
const mats = new Map();
function M(color, flat = false) {
  const k = color + flat;
  if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color, roughness: 0.85, flatShading: flat }));
  return mats.get(k);
}
function add(parent, geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, typeof mat === "string" ? M(mat) : mat);
  m.position.set(x, y, z);
  m.castShadow = shadow;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
const rb = (w, h, d, r = 0.1) => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2) * 0.999);
function prism(w, h, d, peak = 0.5) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(-w / 2 + w * peak, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false });
  g.translate(0, 0, -d / 2);
  return g;
}
let seed = 11;
const rand = () => {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

// Windows: collected per building, then drawn as one InstancedMesh so they can be relit cheaply.
const winGeo = new THREE.BoxGeometry(0.34, 0.44, 0.04);
const winMat = new THREE.MeshBasicMaterial({ color: "#ffffff" });
const windowSets = [];
let litFraction = 0.45;
function addWindows(g, x, y0, z, w, h, d, { colW = 0.7, rowH = 0.8 } = {}) {
  const list = (g.userData.win ||= []);
  const rows = Math.max(0, Math.floor((h - 0.9) / rowH) + 1);
  for (const [nx, nz, fw] of [[0, 1, w], [0, -1, w], [1, 0, d], [-1, 0, d]]) {
    const cols = Math.max(1, Math.floor((fw - 0.3) / colW));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const u = (c - (cols - 1) / 2) * colW;
        list.push({
          x: x + (nx ? nx * (w / 2 + 0.015) : u),
          y: y0 + 0.55 + r * rowH,
          z: z + (nz ? nz * (d / 2 + 0.015) : u),
          ry: nx ? Math.PI / 2 : 0,
        });
      }
    }
  }
}
function finalizeWindows(g) {
  const list = g.userData.win;
  if (!list?.length) return;
  const im = new THREE.InstancedMesh(winGeo, winMat, list.length);
  const o = new THREE.Object3D();
  list.forEach((w, i) => {
    o.position.set(w.x, w.y, w.z);
    o.rotation.set(0, w.ry, 0);
    o.updateMatrix();
    im.setMatrixAt(i, o.matrix);
  });
  im.userData.ranks = list.map(() => Math.random());
  g.add(im);
  windowSets.push(im);
  delete g.userData.win;
}
function paintWindows() {
  const lit = new THREE.Color(THEME.lit), un = new THREE.Color(THEME.unlit);
  for (const im of windowSets) {
    im.userData.ranks.forEach((r, i) => im.setColorAt(i, r < litFraction ? lit : un));
    im.instanceColor.needsUpdate = true;
  }
}

/* ---------- picking, labels, targets ---------- */
const pickRoots = [], liftables = [], targets = new Map(), labels = [];
const districtInfo = Object.fromEntries(DISTRICTS.map((d) => [d.key, d]));

function label(parent, text, key, y, sm = false) {
  const wrap = document.createElement("div");
  const b = document.createElement("button");
  b.type = "button";
  b.className = "label" + (sm ? " sm" : "");
  b.textContent = text;
  if (!sm) b.style.setProperty("--dot", districtInfo[key]?.color);
  b.addEventListener("click", (e) => { e.stopPropagation(); App.select(key); });
  wrap.appendChild(b);
  const o = new CSS2DObject(wrap);
  o.position.set(0, y, 0);
  parent.add(o);
  labels.push({ o, b, key, sm, on: false });
  return o;
}
function district(key, x, z, plotColor, labelY, zoom = 1.85) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.userData.key = key;
  world.add(g);
  pickRoots.push(g);
  if (plotColor) add(g, rb(10.4, 0.1, 10.4, 0.2), plotColor, 0, 0.03, 0, false);
  targets.set(key, { obj: g, zoom });
  label(g, districtInfo[key].label, key, labelY);
  return g;
}
function item(parent, key, x, z, zoom = 2.1) {
  const g = new THREE.Group();
  g.position.set(x, 0.08, z);
  g.userData.key = key;
  g.userData.baseY = 0.08;
  parent.add(g);
  liftables.push(g);
  targets.set(key, { obj: g, zoom });
  return g;
}

// Footprints that trees must avoid (world coords).
const blocked = [];
const block = (x, z, w, d, pad = 0.35) => blocked.push([x - w / 2 - pad, z - d / 2 - pad, x + w / 2 + pad, z + d / 2 + pad]);

/* ---------- island ---------- */
const world = new THREE.Group();
scene.add(world);
const waterMat = new THREE.MeshStandardMaterial({ color: "#79c4e2", roughness: 0.35 });
const water = add(world, new THREE.PlaneGeometry(400, 400), waterMat, 0, -0.7, 0, false);
water.rotation.x = -Math.PI / 2;

function route() {
  const ai = Math.floor(Math.random() * 4), bi = (ai + 1 + Math.floor(Math.random() * 3)) % 4;
  const a = ARM[ai], b = ARM[bi], L = 0.45;
  const pts = [
    dirOf(a).multiplyScalar(12.6).addScaledVector(sideOf(a), L),
    dirOf(a).multiplyScalar(3.0).addScaledVector(sideOf(a), L),
  ];
  let end = b;
  while (end <= a) end += Math.PI * 2;
  for (let s = 0; s <= 12; s++) pts.push(dirOf(a + ((end - a) * s) / 12).multiplyScalar(2.35));
  pts.push(dirOf(b).multiplyScalar(3.0).addScaledVector(sideOf(b), -L), dirOf(b).multiplyScalar(12.6).addScaledVector(sideOf(b), -L));
  for (const p of pts) p.y = 0.06;
  const cum = [0];
  for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + pts[k].distanceTo(pts[k - 1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function along(r, s, out) {
  let k = 1;
  while (k < r.cum.length - 1 && r.cum[k] < s) k++;
  const f = (s - r.cum[k - 1]) / (r.cum[k] - r.cum[k - 1] || 1);
  return out.lerpVectors(r.pts[k - 1], r.pts[k], THREE.MathUtils.clamp(f, 0, 1));
}

    m.position.set((p - 1.5) * 0.9, rand() * 0.4, (rand() - 0.5) * 0.8);
    m.scale.setScalar(0.6 + rand() * 0.6);
    m.castShadow = true;
    g.add(m);
  }
  g.position.set(-24 + k * 9 + rand() * 4, 9 + rand() * 2, -14 + rand() * 28);
  world.add(g);
  clouds.push({ g, v: 0.3 + rand() * 0.3 });
}

scene.updateMatrixWorld(true);
const smokeGeo = new THREE.IcosahedronGeometry(0.28, 0);
const puffs = [];
for (const top of chimneyTops) {
  const origin = top.getWorldPosition(new THREE.Vector3());
  for (let k = 0; k < 8; k++) {
    const mat = new THREE.MeshStandardMaterial({ color: "#f4f4f4", transparent: true, opacity: 0.7, flatShading: true, depthWrite: false });
    const m = new THREE.Mesh(smokeGeo, mat);
    scene.add(m);
    puffs.push({ m, origin, age: k * 0.35, life: 2.8 });
  }
}

/* ---------- theme ---------- */
function applyTheme() {
  THEME = App.isDark() ? THEMES.night : THEMES.day;
  scene.background = new THREE.Color(THEME.sky);
  waterMat.color.set(THEME.water);
  hemi.color.set(THEME.hemiSky);
  hemi.groundColor.set(THEME.hemiGround);
  hemi.intensity = THEME.hemi;
  sun.color.set(THEME.sun);
  sun.intensity = THEME.sunI;
  fog.color.set(THEME.sky);
  cloudMat.color.set(THEME.cloud);
  lampMat.color.set(THEME.lamp);
  beaconMat.color.set(THEME.beam ? "#ffd57e" : "#fff6cc");
  beam.visible = THEME.beam;
  for (const p of puffs) p.m.material.color.set(THEME.smoke);
  paintWindows();
}

/* ---------- camera moves ---------- */
const homeZoom = () => (narrow() ? 1.1 : 1);
// Overview centre sits a little toward downtown so the tall towers are not clipped at the top.
const HOME_TARGET = new THREE.Vector3(-1.5, 0, -1.5);
const fly = { active: false };
function flyTo(pos, zoom, dur = 950, offsetTo = null) {
  const offset = camera.position.clone().sub(controls.target);
  Object.assign(fly, {
    active: true, t0: performance.now(), dur: reduceMotion ? 1 : dur,
    fromT: controls.target.clone(), toT: pos.clone(), fromZ: camera.zoom, toZ: zoom,
    offset, fromO: offset.clone(), toO: (offsetTo || offset).clone(),
  });
}
// Shift the focus point so the building stays visible beside (desktop) or above (phone) the detail panel.
function framed(p, zoom) {
  const w = host.clientWidth, h = host.clientHeight;
  const wpp = (camera.top - camera.bottom) / zoom / h;
  const off = camera.position.clone().sub(controls.target);
  const fwd = new THREE.Vector3(-off.x, 0, -off.z).normalize();
  const sinE = Math.sin(Math.atan2(off.y, Math.hypot(off.x, off.z)));
  if (w < 721) return p.clone().addScaledVector(fwd, -((h * 0.6) / 2.4) * wpp / sinE);
  const right = new THREE.Vector3().crossVectors(fwd, UP);
  return p.clone().addScaledVector(right, ((Math.min(400, w * 0.42) + 16) / 2) * wpp);
}
function focus(key) {
  const t = targets.get(key);
  if (!t) return;
  // Aim at the middle of the building, not its base, so tall towers stay in frame.
  const box = new THREE.Box3().setFromObject(t.obj);
  const p = t.obj.getWorldPosition(new THREE.Vector3());
  p.y = t.obj === about || t.obj.parent === world ? 0 : Math.min(3, (box.max.y - box.min.y) / 2);
  const zoom = t.zoom * (narrow() ? 0.72 : 1);
  flyTo(framed(p, zoom), zoom);
}
controls.addEventListener("start", () => { fly.active = false; App.dismissHint(); });

function clampTarget() {
  const t = controls.target;
  const cx = THREE.MathUtils.clamp(t.x, -14, 14), cz = THREE.MathUtils.clamp(t.z, -14, 18);
  if (cx !== t.x || cz !== t.z) {
    camera.position.x += cx - t.x;
    camera.position.z += cz - t.z;
    t.x = cx;
    t.z = cz;
  }
}

/* ---------- input ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitKey(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, walk.on ? walkCam : camera);
  for (const h of ray.intersectObjects(pickRoots, true)) {
    let o = h.object;
    while (o && !o.userData.key) o = o.parent;
    if (o) return o.userData.key;
  }
  return null;
}
const el = renderer.domElement, pointers = new Set();
let tap = null, hoverEvent = null, hovered = null;
el.addEventListener("pointerdown", (e) => {
  pointers.add(e.pointerId);
  tap = pointers.size === 1 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null;
});
el.addEventListener("pointerup", (e) => {
  pointers.delete(e.pointerId);
  if (!tap) return;
  const isTap = Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 8 && performance.now() - tap.t < 450;
  tap = null;
  if (!isTap) return;
  const k = hitKey(e);
  if (k) App.select(k);
  else App.close();
});
el.addEventListener("pointercancel", (e) => { pointers.delete(e.pointerId); tap = null; });
el.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") hoverEvent = e; });
el.addEventListener("pointerleave", () => { hovered = null; el.style.cursor = ""; });

/* ---------- walk mode: a street-level camera ---------- */
const walkCam = new THREE.PerspectiveCamera(70, 1, 0.05, 140);
const fog = new THREE.Fog("#cfe7f4", 12, 42);
const EYE = 0.72, SPEED = 3.2, TURN = 2.2, R = 0.22;
const walk = { on: false, busy: false, yaw: 0, pitch: 0, pos: new THREE.Vector3(), keys: new Set(), downAt: {}, stick: { x: 0, y: 0 }, step: 0, near: null, turnTo: null, look: null };
const hasItems = new Set([...targets.values()].filter((t) => t.obj.parent !== world).map((t) => t.obj.parent.userData.key));
document.body.classList.toggle("touch", coarse);

// The island, plus the first stretch of the pier. Buildings and trees use the same footprints that keep trees apart.
function walkable(x, z) {
  if (!(Math.abs(x) < 12.6 && Math.abs(z) < 12.6) && !(Math.abs(x) < 1.15 && z > 0 && z < 13.5)) return false;
  if (Math.hypot(x, z) < 1.1 + R || Math.hypot(x - 1.3, z - 0.75) < 0.3 + R) return false; // fountain, the waving figure
  if (poles.some(([px, pz]) => Math.hypot(x - px, z - pz) < 0.06 + R)) return false;
  const p = R * 0.4;
  return !blocked.some(([a, b, c, d]) => x > a - p && x < c + p && z > b - p && z < d + p);
}
const placePos = (key) => targets.get(key).obj.getWorldPosition(new THREE.Vector3()).setY(0);
const placeName = (key) => labels.find((l) => l.key === key)?.b.textContent || districtInfo[key]?.label || key;
const faceYaw = (from, to) => Math.atan2(-(to.x - from.x), -(to.z - from.z));
const fwdOf = (yaw) => new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));

// The place you are standing at and roughly looking toward; buildings win over the district around them.
function nearestPlace() {
  const fwd = fwdOf(walk.yaw);
  let best = null, bestScore = Infinity;
  for (const [key, t] of targets) {
    const isItem = t.obj.parent !== world;
    const reach = isItem ? 4.2 : key === "about" ? 3.6 : key === "contact" ? 4.2 : hasItems.has(key) && key !== "education" ? 0 : 5.2;
    if (!reach) continue;
    const p = placePos(key), d = Math.hypot(p.x - walk.pos.x, p.z - walk.pos.z);
    if (d > reach) continue;
    const to = p.sub(walk.pos).setY(0).normalize();
    const score = d - 1.5 * to.dot(fwd) - (isItem ? 0.8 : 0);
    if (score < bestScore) { bestScore = score; best = key; }
  }
  return best;
}
const openBtn = document.getElementById("walk-open");
const nearSay = Object.assign(document.createElement("span"), { className: "sr" });
nearSay.setAttribute("aria-live", "polite");
nearSay.style.cssText = "position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap";
openBtn.after(nearSay);
function setNear(key) {
  if (key === walk.near) return;
  walk.near = key;
  openBtn.classList.toggle("show", !!key);
  if (!key) return;
  openBtn.querySelector("b").textContent = `Open: ${placeName(key)}`;
  nearSay.textContent = `${placeName(key)} is in front of you. Press E to open it.`;
}
openBtn.addEventListener("click", () => { if (walk.near) App.select(walk.near); });

function fadeSwap(fn) {
  const f = document.getElementById("fade");
  if (reduceMotion) { fn(); return; }
  walk.busy = true;
  f.classList.add("on");
  setTimeout(() => { fn(); walk.busy = false; requestAnimationFrame(() => f.classList.remove("on")); }, 190);
}
function setWalk(on) {
  if (on === walk.on || walk.busy || !readySent) return;
  if (App.current) App.close();
  fadeSwap(() => {
    walk.on = on;
    document.body.classList.toggle("walking", on);
    const b = document.querySelector("[data-walk]");
    b.setAttribute("aria-pressed", String(on));
    b.setAttribute("aria-label", on ? "Back to the map" : "Walk around the city");
    b.title = b.getAttribute("aria-label");
    controls.enabled = !on;
    renderPass.camera = on ? walkCam : camera;
    hBlur.enabled = vBlur.enabled = !on;
    scene.fog = on ? fog : null;
    walk.keys.clear();
    walk.stick.x = walk.stick.y = 0;
    if (on) {
      // Start on the south road, looking up at the fountain and the little waving figure.
      walk.pos.set(0, 0, 6.4);
      walk.yaw = 0;
      walk.pitch = 0.04;
      walk.turnTo = null;
    } else {
      setNear(null);
      flyTo(HOME_TARGET, homeZoom(), 1, HOME);
    }
  });
  App.dismissHint();
  if (on) App.hint(coarse ? "Use the stick to walk · drag to look around" : "WASD or arrows to walk · drag to look · E to open · Esc for the map", 8000);
  App.toast(on ? "Walking the city" : "Back to the map");
}

// Picking a place while walking takes you to a free spot in front of it, instead of flying the map camera.
function walkTo(key) {
  const t = targets.get(key);
  if (!t) return;
  const p = placePos(key), isItem = t.obj.parent !== world;
  const lookUp = isItem ? 0.22 : 0.08;
  if (Math.hypot(p.x - walk.pos.x, p.z - walk.pos.z) <= (isItem ? 3.6 : 6)) { walk.turnTo = faceYaw(walk.pos, p); return; }
  let best = null, bd = Infinity;
  for (const r of isItem ? [2.6, 3.2] : [4.5, 6, 7.5]) {
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2, x = p.x + Math.cos(a) * r, z = p.z + Math.sin(a) * r;
      if (!walkable(x, z)) continue;
      const d = Math.hypot(x - walk.pos.x, z - walk.pos.z);
      if (d < bd) { bd = d; best = [x, z]; }
    }
    if (best) break;
  }
  if (!best) return;
  fadeSwap(() => {
    walk.pos.set(best[0], 0, best[1]);
    walk.yaw = faceYaw(walk.pos, p);
    walk.pitch = lookUp;
    walk.turnTo = null;
  });
}

function walkStep(dt) {
  const k = walk.keys, run = k.has("shift") ? 1.7 : 1;
  const ahead = (k.has("w") || k.has("arrowup") ? 1 : 0) - (k.has("s") || k.has("arrowdown") ? 1 : 0) - walk.stick.y;
  const side = (k.has("d") ? 1 : 0) - (k.has("a") ? 1 : 0);
  const turn = (k.has("arrowleft") ? 1 : 0) - (k.has("arrowright") ? 1 : 0) - walk.stick.x * 0.9;
  if (turn) walk.turnTo = null;
  walk.yaw += turn * TURN * dt;
  if (walk.turnTo !== null) {
    const diff = Math.atan2(Math.sin(walk.turnTo - walk.yaw), Math.cos(walk.turnTo - walk.yaw));
    walk.yaw += reduceMotion ? diff : diff * Math.min(1, dt * 6);
    if (Math.abs(diff) < 0.01) walk.turnTo = null;
  }
  const fwd = fwdOf(walk.yaw), right = new THREE.Vector3(Math.cos(walk.yaw), 0, -Math.sin(walk.yaw));
  const v = fwd.multiplyScalar(ahead).addScaledVector(right, side);
  if (v.lengthSq() > 1) v.normalize();
  v.multiplyScalar(SPEED * run * dt);
  // Slide along walls: try each axis on its own.
  const moved = v.lengthSq() > 0;
  if (walkable(walk.pos.x + v.x, walk.pos.z)) walk.pos.x += v.x;
  if (walkable(walk.pos.x, walk.pos.z + v.z)) walk.pos.z += v.z;
  if (moved) { walk.step += v.length() * 5; App.dismissHint(); }
  const bob = reduceMotion ? 0 : Math.abs(Math.sin(walk.step)) * 0.035;
  walkCam.position.set(walk.pos.x, EYE + bob, walk.pos.z);
  walkCam.rotation.set(walk.pitch, walk.yaw, 0, "YXZ");
  setNear(nearestPlace());
}

const WALK_KEYS = new Set(["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", "shift"]);
addEventListener("keydown", (e) => {
  if (!walk.on || e.metaKey || e.ctrlKey || e.altKey || document.body.classList.contains("mode-resume")) return;
  if (e.target.closest?.("#panel, input, textarea, select")) return;
  const k = e.key.toLowerCase();
  if (k === "e" || (k === "enter" && e.target === document.body)) {
    e.preventDefault();
    if (walk.near) App.select(walk.near);
    else App.toast("Walk up to a building to open it");
    return;
  }
  if (!WALK_KEYS.has(k)) return;
  if (!walk.keys.has(k)) walk.downAt[k] = performance.now();
  walk.keys.add(k);
  if (k.startsWith("arrow")) e.preventDefault();
});
// a quick tap still counts as a short step
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase(), held = performance.now() - (walk.downAt[k] || 0);
  setTimeout(() => walk.keys.delete(k), Math.max(0, 160 - held));
});
addEventListener("blur", () => walk.keys.clear());

// Drag on the scene to look around; a short tap still picks a building.
el.addEventListener("pointerdown", (e) => { if (walk.on) walk.look = { id: e.pointerId, x: e.clientX, y: e.clientY }; });
el.addEventListener("pointermove", (e) => {
  const l = walk.look;
  if (!walk.on || !l || l.id !== e.pointerId) return;
  walk.yaw -= (e.clientX - l.x) * 0.006;
  walk.pitch = THREE.MathUtils.clamp(walk.pitch - (e.clientY - l.y) * 0.004, -0.6, 0.7);
  l.x = e.clientX;
  l.y = e.clientY;
  walk.turnTo = null;
});
for (const ev of ["pointerup", "pointercancel"]) el.addEventListener(ev, (e) => { if (walk.look?.id === e.pointerId) walk.look = null; });

// Touch stick: up walks forward, sideways turns.
const stick = document.getElementById("stick"), knob = stick.firstElementChild;
let stickId = null;
function stickMove(e) {
  const r = stick.getBoundingClientRect(), max = r.width / 2 - 14;
  let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
  const l = Math.hypot(x, y);
  if (l > max) { x *= max / l; y *= max / l; }
  knob.style.transform = `translate(${x}px, ${y}px)`;
  const dead = (n) => (Math.abs(n) < 0.12 ? 0 : n);
  walk.stick.x = dead(x / max);
  walk.stick.y = dead(y / max);
}
stick.addEventListener("pointerdown", (e) => {
  stickId = e.pointerId;
  try { stick.setPointerCapture(e.pointerId); } catch {}
  stickMove(e);
});
stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) stickMove(e); });
function stickEnd(e) {
  if (e.pointerId !== stickId) return;
  stickId = null;
  walk.stick.x = walk.stick.y = 0;
  knob.style.transform = "";
}
stick.addEventListener("pointerup", stickEnd);
stick.addEventListener("pointercancel", stickEnd);

/* ---------- loop ---------- */
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  const a = w / h, viewH = Math.max(25, 33 / a);
  Object.assign(camera, { left: (-viewH * a) / 2, right: (viewH * a) / 2, top: viewH / 2, bottom: -viewH / 2 });
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  labelRenderer.setSize(w, h);
  walkCam.aspect = a;
  walkCam.fov = a < 1 ? 78 : 62;
  walkCam.updateProjectionMatrix();
  hBlur.uniforms.h.value = (coarse ? 4 : 5) / w;
  vBlur.uniforms.v.value = (coarse ? 4 : 5) / h;
}
addEventListener("resize", resize);

let intro = reduceMotion ? null : { t0: performance.now(), dur: 1900 };
camera.zoom = intro ? 0.55 : homeZoom();
camera.updateProjectionMatrix();
controls.enabled = !intro;

const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let readySent = false;
function ready() {
  if (readySent) return;
  readySent = true;
  App.cityReady();
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = performance.now();

  if (intro) {
    const k = Math.min(1, (now - intro.t0) / intro.dur), e = 1 - Math.pow(1 - k, 3);
    camera.position.copy(controls.target).add(HOME.clone().applyAxisAngle(UP, -0.9 * (1 - e)));
    camera.zoom = lerp(0.55, homeZoom(), e);
    camera.updateProjectionMatrix();
    if (k >= 1) { intro = null; controls.enabled = true; ready(); }
  } else if (fly.active) {
    const k = Math.min(1, (now - fly.t0) / fly.dur), e = ease(k);
    controls.target.lerpVectors(fly.fromT, fly.toT, e);
    camera.position.copy(controls.target).add(fly.offset.lerpVectors(fly.fromO, fly.toO, e));
    camera.zoom = lerp(fly.fromZ, fly.toZ, e);
    camera.updateProjectionMatrix();
    if (k >= 1) fly.active = false;
  }
  controls.update();
  clampTarget();
  if (walk.on) walkStep(dt);

  if (hoverEvent) {
    hovered = hitKey(hoverEvent);
    el.style.cursor = hovered ? "pointer" : "";
    hoverEvent = null;
  }
  for (const g of liftables) {
    const on = g.userData.key === hovered || g.userData.key === App.current;
    const goal = g.userData.baseY + (on ? 0.22 : 0);
    g.position.y += (goal - g.position.y) * Math.min(1, dt * 10);
  }
  const showSmall = camera.zoom > 1.5;
  for (const l of labels) {
    if (walk.on) {
      // Street level: only nearby signs, so the sky is not full of floating labels.
      const d = l.o.getWorldPosition(tmp).distanceTo(walkCam.position);
      l.o.visible = l.key === App.current || d < (l.sm ? 7.5 : 16);
    } else l.o.visible = !l.sm || showSmall || l.key === App.current;
    const on = l.key === hovered || l.key === App.current;
    if (on !== l.on) { l.on = on; l.b.classList.toggle("is-hot", on); }
  }

  // the campus clock shows the visitor's real time
  const now2 = new Date(), mins = now2.getMinutes() + now2.getSeconds() / 60, hrs = (now2.getHours() % 12) + mins / 60;
  for (const { hand, speed } of clockHands) hand.rotation.z = -((speed === 1 ? mins / 60 : hrs / 12) * Math.PI * 2);
  if (!reduceMotion) {
    for (const c of cars) {
      c.s += c.v * dt;
      if (c.s >= c.r.len) { c.r = route(); c.s = 0; }
      along(c.r, c.s, c.g.position);
      along(c.r, Math.min(c.s + 0.3, c.r.len), tmp);
      if (tmp.distanceToSquared(c.g.position) > 1e-6) c.g.lookAt(tmp);
      // While walking, cars shrink away as they near you instead of driving through the camera.
      const near = walk.on ? THREE.MathUtils.clamp((c.g.position.distanceTo(walkCam.position) - 0.9) / 1.4, 0, 1) : 1;
      c.g.scale.setScalar(Math.max(0.001, Math.min(1, c.s / 0.8, (c.r.len - c.s) / 0.8) * near));
    }
    for (const c of clouds) {
      c.g.position.x += c.v * dt;
      if (c.g.position.x > 28) c.g.position.x = -28;
    }
    for (const p of puffs) {
      p.age = (p.age + dt) % p.life;
      const k = p.age / p.life;
      p.m.position.set(p.origin.x + k * 1.2, p.origin.y + k * 2.2, p.origin.z - k * 0.4);
      p.m.scale.setScalar(0.6 + k * 1.6);
      p.m.material.opacity = 0.7 * (1 - k);
    }
    for (const c of cranes) c.top.rotation.y = c.phase + Math.sin(t * c.speed) * 1.3;
    jet.scale.set(1, 1 + Math.sin(t * 5) * 0.25, 1);
    me.position.y = 0.16 + Math.abs(Math.sin(t * 2.2)) * 0.03;
    const waving = t % 5 < 1.6;
    arm.rotation.z = lerp(arm.rotation.z, waving ? 2.5 + Math.sin(t * 10) * 0.35 : 0.15, Math.min(1, dt * 8));
    beamPivot.rotation.y += dt * 0.9;
  }

  composer.render();
  labelRenderer.render(scene, walk.on ? walkCam : camera);
  keepLabelsOnScreen();
  if (!intro) ready();
}

// District labels near the island's edge can spill off a narrow screen; slide them back in.
function keepLabelsOnScreen() {
  const W = host.clientWidth;
  for (const l of labels) {
    if (l.sm) continue;
    const dx0 = l.dx || 0;
    let dx = 0;
    if (l.o.visible && !walk.on) {
      const r = l.b.getBoundingClientRect(), left = r.left - dx0, right = r.right - dx0;
      if (r.width) dx = left < 8 ? 8 - left : right > W - 8 ? W - 8 - right : 0;
    }
    if (dx !== dx0) { l.dx = dx; l.b.style.translate = dx ? `${dx}px 0` : ""; }
  }
}

function pause(p) {
  renderer.setAnimationLoop(p ? null : frame);
  if (!p) clock.getDelta();
}

applyTheme();
setActivity(App.activity || { commits: null });
resize();
App.city = {
  focus: (key) => (walk.on ? walkTo(key) : focus(key)),
  overview: () => { if (!walk.on) flyTo(HOME_TARGET, homeZoom()); },
  toggleWalk: () => setWalk(!walk.on),
  exitWalk: () => setWalk(false),
  zoomBy: (f) => flyTo(controls.target.clone(), THREE.MathUtils.clamp(camera.zoom * f, controls.minZoom, controls.maxZoom), 300),
  resetView: () => flyTo(HOME_TARGET, homeZoom(), 900, HOME),
  pause,
  resize,
  setTheme: applyTheme,
  setActivity,
};
pause(document.body.classList.contains("mode-resume"));
if (document.body.classList.contains("mode-resume")) ready();
</script>
